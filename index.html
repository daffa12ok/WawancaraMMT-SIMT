<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Galeri Dokumentasi</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <h1>Dokumentasi Gambar</h1>
  </header>

  <main class="gallery">
    <div class="card">
      <img src="febri himawan.jpg" alt="Febri Himawan" />
      <div class="card-content">
        <h3>Febri Himawan</h3>
        <button onclick="downloadImage('Febri Himawan.jpg')">Download</button>
      </div>
    </div>

    <div class="card">
      <img src="dedy ardiansyah.jpg" alt="Dedy Ardiansyah" />
      <div class="card-content">
        <h3>Dedy Ardiansyah</h3>
        <button onclick="downloadImage('Dedy Ardiansyah.jpg')">Download</button>
      </div>
    </div>

    <div class="card">
      <img src="herlinda nur tariah.jpg" alt="Herlinda Nur Tariah" />
      <div class="card-content">
        <h3>Herlinda Nur Tariah</h3>
        <button onclick="downloadImage('Herlinda Nur Tariah.jpg')">Download</button>
      </div>
    </div>

    <div class="card">
      <img src="moh atlomasiga hasan zahrandy.jpg" alt="Moh Atlomasiga Hasan Zahrandy" />
      <div class="card-content">
        <h3>Moh Atlomasiga Hasan Zahrandy</h3>
        <button onclick="downloadImage('Moh Atlomasiga Hasan Zahrandy.jpg')">Download</button>
      </div>
    </div>

    <div class="card">
      <img src="muhammad ricky dwiyantoro.jpg" alt="Muhammad Ricky Dwiyantoro" />
      <div class="card-content">
        <h3>Muhammad Ricky Dwiyantoro</h3>
        <button onclick="downloadImage('Muhammad Ricky Dwiyantoro.jpg')">Download</button>
      </div>
    </div>

    <div class="card">
      <img src="luthfan zul fahmi.jpg" alt="Luthfan Zul Fahmi" />
      <div class="card-content">
        <h3>Luthfan Zul Fahmi</h3>
        <button onclick="downloadImage('Luthfan Zul Fahmi.jpg')">Download</button>
      </div>
    </div>

    <div class="card">
      <img src="raihan adi nugroho.jpg" alt="Raihan Adi Nugroho" />
      <div class="card-content">
        <h3>Raihan Adi Nugroho</h3>
        <button onclick="downloadImage('Raihan Adi Nugroho.jpg')">Download</button>
      </div>
    </div>

    <div class="card">
      <img src="ammas safinadriyah.jpg" alt="Ammas Safinadriyah" />
      <div class="card-content">
        <h3>Ammas Safinadriyah</h3>
        <button onclick="downloadImage('ammas safinadriyah.jpg')">Download</button>
      </div>
    </div>

    <div class="card">
      <img src="rahmat ramadhani.jpg" alt="Rahmat Ramadhani" />
      <div class="card-content">
        <h3>Rahmat Ramadhani</h3>
        <button onclick="downloadImage('Rahmat Ramadhani.jpg')">Download</button>
      </div>
    </div>

    <div class="card">
      <img src="fia afina yusviana.jpg" alt="Fia Afina Yusviana" />
      <div class="card-content">
        <h3>Fia Afina Yusviana</h3>
        <button onclick="downloadImage('Fia Afina Yusviana.jpg')">Download</button>
      </div>
    </div>

    <div class="card">
      <img src="novi siti nurapriyani.jpg" alt="Novi Siti Nurapriyani" />
      <div class="card-content">
        <h3>Novi Siti Nurapriyani</h3>
        <button onclick="downloadImage('Novi Siti Nurapriyani.jpg')">Download</button>
      </div>
    </div>
  </main>

  <!-- Modal -->
  <div class="modal" id="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <img class="modal-img" id="modalImage" />
  </div>

  <script>
    function downloadImage(imageUrl) {
      const link = document.createElement('a');
      link.href = imageUrl;
      link.download = imageUrl;
      link.click();
    }

    document.querySelectorAll('.card img').forEach(img => {
      img.addEventListener('click', () => {
        document.getElementById('modalImage').src = img.src;
        document.getElementById('modal').style.display = 'flex';
      });
    });

    function closeModal() {
      document.getElementById('modal').style.display = 'none';
    }
  </script>
</body>
</html>
